<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BabsonGPT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="layout">
      <!-- LEFT SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-circle">B</div>
          <div class="logo-text">
            <div class="logo-title">BabsonGPT</div>
            <div class="logo-subtitle">Powered by OpenAI API</div>
          </div>
        </div>

        <button class="new-chat-btn" id="new-chat-btn">+ New chat</button>

        <div class="sidebar-section-label">Recent</div>
        <ul class="chat-list" id="chat-list">
          <!-- chat items will be injected here -->
        </ul>

        <div class="sidebar-footer">
          <div class="sidebar-foot-label">Account</div>
          <div class="sidebar-foot-pill">Student · Babson College</div>
        </div>
      </aside>

      <!-- MAIN CHAT AREA -->
      <main class="main">
        <header class="main-header">
          <div class="main-title-group">
            <h1 class="main-title">BabsonGPT</h1>
            <p class="main-subtitle">
              Ask questions, brainstorm ideas, and explore concepts.
            </p>
          </div>
        </header>

        <section id="chat-log" class="chat-log"></section>

        <section class="input-wrapper">
          <div class="input-area">
            <textarea
              id="user-input"
              rows="2"
              placeholder="Message BabsonGPT..."
            ></textarea>
            <button id="send-btn" class="send-btn">Send</button>
          </div>
          <p class="input-hint">
            BabsonGPT: Made by Simon East
          </p>
        </section>
      </main>
    </div>

    <script>
      // Local storage key for multi-chat data
      const STORAGE_KEY = "babsongpt_chats_v2";

      const chatLog = document.getElementById("chat-log");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const newChatBtn = document.getElementById("new-chat-btn");
      const chatListEl = document.getElementById("chat-list");

      const SYSTEM_MESSAGE = {
        role: "system",
        content:
          "You are BabsonGPT, a helpful assistant for a Babson College student.",
      };

      // All chats and the currently active chat id
      let chats = [];
      let activeChatId = null;

      // For convenience, this alias always points at the active chat's messages
      let messages = [];

      function saveAll() {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({ chats: chats, activeChatId: activeChatId })
          );
        } catch (e) {
          console.warn("Could not save chats:", e);
        }
      }

      function loadAll() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) {
          console.warn("Could not load chats:", e);
          return null;
        }
      }

      function getActiveChat() {
        return chats.find((c) => c.id === activeChatId) || null;
      }

      function addMessageToLog(role, text) {
        const wrapper = document.createElement("div");
        wrapper.className = "message " + role;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "You" : "B";

        const content = document.createElement("div");
        content.className = "message-content";

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = role === "user" ? "You" : "BabsonGPT";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = text.replace(/\n/g, "<br>");

        content.appendChild(label);
        content.appendChild(bubble);

        wrapper.appendChild(avatar);
        wrapper.appendChild(content);

        chatLog.appendChild(wrapper);
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      function renderActiveChat() {
        chatLog.innerHTML = "";
        const chat = getActiveChat();
        if (!chat) return;
        messages = chat.messages;
        messages.forEach((m) => {
          if (m.role === "user") {
            addMessageToLog("user", m.content);
          } else if (m.role === "assistant") {
            addMessageToLog("assistant", m.content);
          }
          // system messages are not shown
        });
      }

      function renderSidebar() {
        chatListEl.innerHTML = "";
        if (!chats.length) return;

        chats
          .slice()
          .sort((a, b) => b.createdAt - a.createdAt) // most recent on top
          .forEach((chat) => {
            const li = document.createElement("li");
            li.className =
              "chat-list-item" +
              (chat.id === activeChatId ? " active" : "");
            li.dataset.chatId = chat.id;

            const dot = document.createElement("span");
            dot.className = "chat-list-dot";

            const titleSpan = document.createElement("span");
            titleSpan.className = "chat-list-title";
            titleSpan.textContent = chat.title || "Chat";

            li.appendChild(dot);
            li.appendChild(titleSpan);
            chatListEl.appendChild(li);
          });
      }

      function createNewChat(initialGreeting, title) {
        const id = Date.now().toString();
        const msgs = [
          SYSTEM_MESSAGE,
          { role: "assistant", content: initialGreeting },
        ];
        const chat = {
          id: id,
          title: title || "New chat",
          messages: msgs,
          createdAt: Date.now(),
        };
        chats.push(chat);
        activeChatId = id;
        saveAll();
        renderSidebar();
        renderActiveChat();
      }

      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        const chat = getActiveChat();
        if (!chat) return;
        messages = chat.messages;

        addMessageToLog("user", text);
        messages.push({ role: "user", content: text });

        // If this is the first user message for this chat, use it as the title
        const hasUserMessages = messages.some((m) => m.role === "user");
        if (!chat.title || chat.title === "New chat") {
          if (hasUserMessages) {
            chat.title = text.slice(0, 40) || "Chat";
          }
        }
        saveAll();
        renderSidebar();

        userInput.value = "";
        userInput.disabled = true;
        sendBtn.disabled = true;
        sendBtn.textContent = "Thinking...";

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: messages }),
          });

          const data = await res.json();
          if (data.error) {
            const msg = "[Error] " + data.error;
            addMessageToLog("assistant", msg);
            messages.push({ role: "assistant", content: msg });
          } else {
            addMessageToLog("assistant", data.reply);
            messages.push({ role: "assistant", content: data.reply });
          }
          saveAll();
        } catch (err) {
          const msg = "[Error] " + err.message;
          addMessageToLog("assistant", msg);
          messages.push({ role: "assistant", content: msg });
          saveAll();
        } finally {
          userInput.disabled = false;
          sendBtn.disabled = false;
          sendBtn.textContent = "Send";
          userInput.focus();
        }
      }

      sendBtn.addEventListener("click", sendMessage);

      userInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      // Sidebar click: switch between saved chats
      chatListEl.addEventListener("click", (event) => {
        const item = event.target.closest(".chat-list-item");
        if (!item) return;
        const id = item.dataset.chatId;
        if (!id || id === activeChatId) return;
        activeChatId = id;
        saveAll();
        renderSidebar();
        renderActiveChat();
      });

      // New chat keeps old ones and starts a fresh conversation
      newChatBtn.addEventListener("click", () => {
        createNewChat(
          "New chat started. How can I help you today?",
          "New chat"
        );
      });

      // INITIALIZATION: load from localStorage or create the very first chat
      (function init() {
        const stored = loadAll();
        if (
          stored &&
          Array.isArray(stored.chats) &&
          stored.chats.length > 0
        ) {
          chats = stored.chats;
          activeChatId = stored.activeChatId || stored.chats[0].id;
        } else {
          // First time: create initial chat with greeting
          const greeting =
            "Hi, I'm BabsonGPT. How can I help with your questions or projects today?";
          createNewChat(greeting, "Welcome chat");
          return; // createNewChat already renders + saves
        }
        renderSidebar();
        renderActiveChat();
      })();
    </script>
  </body>
</html>
